<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Cabeçalho comum a todas as páginas: título, CSS e dados demonstrativos -->
<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' - UpBox'">UpBox</title>
    <link rel="icon" th:href="@{/images/upbox-logo.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/dados.js}"></script>
</head>

<!-- Scripts do final da página: app.js monta menu lateral e cabeçalho; o segundo script é o da própria tela -->
<th:block th:fragment="scripts(pagina)">
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{'/js/pages/' + ${pagina} + '.js'}"></script>
</th:block>

</body>
</html>
