<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head th:replace="~{fragments/layout :: cabecalho('Não foi possível abrir a página')}">
 </head>
 <body>
  <main class="pagina-auth">
   <div class="auth-card">
    <div class="auth-logo">
     <img alt="Logo UpBox" th:src="@{/images/upbox-logo.png}"/>
     <span class="marca-nome">
      <b>
       Up
      </b>
      Box
     </span>
    </div>
    <h1 th:text="${status == 404 ? 'Página não encontrada' : 'Não foi possível concluir'}">
    </h1>
    <p th:if="${status == 404}">
     O endereço não existe ou foi alterado. Use o menu para continuar.
    </p>
    <p th:unless="${status == 404}">
     O sistema encontrou uma dificuldade. Tente novamente em instantes.
    </p>
    <a class="btn btn-primario" th:href="@{/}">
     Voltar ao início
    </a>
   </div>
  </main>
 </body>
</html>
