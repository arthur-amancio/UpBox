<!DOCTYPE html>
<html lang="pt-br" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
 <head th:replace="~{fragments/layout :: cabecalho('Dados do usuário')}">
 </head>
 <body>
  <th:block th:replace="~{fragments/layout :: estrutura(~{::section})}">
   <section>
    <div class="pagina-cabecalho">
     <h2>
      Dados do usuário
     </h2>
    </div>
    <form class="form-card" method="post" th:action="${id == null} ? @{/usuarios} : @{/usuarios/{id}(id=${id})}" th:object="${form}">
     <div th:replace="~{fragments/layout :: erros}">
     </div>
     <div class="form-grid">
      <div class="campo">
       <label for="nome">
        Nome completo
       </label>
       <input maxlength="120" required="" th:field="*{nome}"/>
       <small class="erro-campo" th:errors="*{nome}" th:if="${#fields.hasErrors('nome')}">
       </small>
      </div>
      <div class="campo">
       <label for="usuario">
        Nome de usuário
       </label>
       <input maxlength="80" required="" th:field="*{usuario}"/>
       <small class="erro-campo" th:errors="*{usuario}" th:if="${#fields.hasErrors('usuario')}">
       </small>
      </div>
      <div class="campo">
       <label for="email">
        E-mail
       </label>
       <input maxlength="150" required="" th:field="*{email}" type="email"/>
       <small class="erro-campo" th:errors="*{email}" th:if="${#fields.hasErrors('email')}">
       </small>
      </div>
      <div class="campo">
       <label for="perfil">
        Perfil
       </label>
       <select th:field="*{perfil}">
        <option value="FUNCIONARIO">
         Funcionário
        </option>
        <option value="ADMINISTRADOR">
         Administrador
        </option>
       </select>
       <small class="erro-campo" th:errors="*{perfil}" th:if="${#fields.hasErrors('perfil')}">
       </small>
      </div>
      <div class="campo" th:if="${id == null}">
       <label for="senha">
        Senha inicial (mínimo 8 caracteres)
       </label>
       <input autocomplete="new-password" id="senha" minlength="8" name="senha" required="" type="password"/>
      </div>
     </div>
     <div class="form-acoes">
      <button class="btn btn-primario">
       Salvar
      </button>
      <a class="btn btn-secundario" th:href="@{/usuarios}">
       Cancelar
      </a>
     </div>
    </form>
   </section>
  </th:block>
 </body>
</html>
