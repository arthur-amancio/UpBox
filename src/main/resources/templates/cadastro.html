<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Criar conta')}"></head>
<body data-auth="cadastro">
<div class="pagina-auth"><div class="auth-card"><div class="auth-logo"><img th:src="@{/images/upbox-logo.png}" alt="Logo UpBox"><span class="marca-nome"><b>Up</b>Box</span></div>
<p class="auth-subtitulo">Crie sua conta para começar a usar o sistema</p><div id="alvo"></div>
<form id="form" novalidate>
<div class="campo"><label for="nome">Nome completo</label><input id="nome" placeholder="Seu nome completo" autofocus></div>
<div class="campo"><label for="usuario">Nome de usuário</label><input id="usuario" placeholder="Escolha um nome de usuário"></div>
<div class="campo"><label for="email">E-mail</label><input type="email" id="email" placeholder="seuemail@exemplo.com"></div>
<div class="campo"><label for="senha">Senha</label><input type="password" id="senha" placeholder="Crie uma senha"></div>
<div class="campo"><label for="conf">Confirmar senha</label><input type="password" id="conf" placeholder="Repita a senha"></div>
<button class="btn btn-primario btn-bloco" type="submit">Criar conta</button></form>
<p class="auth-rodape">Já tem uma conta? <a th:href="@{/login}">Fazer login</a></p></div></div>
<th:block th:replace="~{fragments/layout :: scripts('auth')}"></th:block>
</body>
</html>
