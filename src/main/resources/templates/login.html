<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
 <head th:replace="~{fragments/layout :: cabecalho('Entrar')}">
 </head>
 <body>
  <div class="pagina-auth">
   <div class="auth-card">
    <div class="auth-logo">
     <img alt="Logo UpBox" th:src="@{/images/upbox-logo.png}"/>
     <span class="marca-nome">
      <b>
       Up
      </b>
      Box
     </span>
    </div>
    <p class="auth-subtitulo">
     Sistema gerenciador de estoque
    </p>
    <p class="alerta alerta-erro" role="alert" th:if="${param.erro}">
     Usuário ou senha inválidos, ou conta inativa.
    </p>
    <p class="alerta alerta-sucesso" th:if="${param.logout}">
     Sessão encerrada.
    </p>
    <p class="alerta alerta-info" th:if="${param.expirada}">
     Sua sessão expirou. Faça login novamente.
    </p>
    <p class="alerta alerta-sucesso" th:if="${param.senhaAlterada}">
     Senha alterada. Entre com a nova senha.
    </p>
    <form method="post" th:action="@{/login}">
     <div class="campo">
      <label for="username">
       Nome de usuário ou e-mail
      </label>
      <input autocomplete="username" autofocus="" id="username" name="username" required=""/>
     </div>
     <div class="campo">
      <label for="password">
       Senha
      </label>
      <input autocomplete="current-password" id="password" name="password" required="" type="password"/>
     </div>
     <button class="btn btn-primario btn-bloco" type="submit">
      Entrar
     </button>
    </form>
    <p class="auth-rodape">
     Solicite sua conta ao administrador.
    </p>
   </div>
  </div>
 </body>
</html>
