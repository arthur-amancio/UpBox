spring.application.name=upbox-sistema
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

# Durante o desenvolvimento, o Thymeleaf atualiza as paginas sem cache.
spring.thymeleaf.cache=false

# Carrega uma senha salva apenas no seu computador, sem enviá-la ao GitHub.
# Copie application-local.example.properties como application-local.properties.
spring.config.import=optional:file:./application-local.properties

# PostgreSQL é o servidor do banco; pgAdmin é apenas o programa de administração.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/upbox}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Apenas para evolucao local do TCC: o JPA cria/atualiza as tabelas.
# Em producao, substitua por migracoes versionadas (e.g. Flyway).
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
