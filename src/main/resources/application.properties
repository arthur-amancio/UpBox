spring.application.name=upbox
server.address=127.0.0.1
server.port=8080

# Preencha somente a senha e ajuste o usuario se necessario.
spring.datasource.url=jdbc:mysql://localhost:3306/upbox
spring.datasource.username=root
spring.datasource.password=

# Somente para desenvolvimento/TCC. Nunca use create ou create-drop no banco de uso.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
