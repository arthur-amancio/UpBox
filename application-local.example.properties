# Copie este arquivo como application-local.properties, na RAIZ do projeto.
# O arquivo local será ignorado pelo Git: a senha fica salva no seu computador.
#
# No pgAdmin, conecte ao servidor PostgreSQL e crie o banco "upbox".
spring.datasource.url=jdbc:postgresql://localhost:5432/upbox
spring.datasource.username=postgres
spring.datasource.password=COLOQUE_A_SENHA_LOCAL_AQUI

# Primeiro administrador: habilite apenas na primeira execução e configure localmente.
upbox.admin-inicial.habilitado=false
upbox.admin-inicial.nome=Administrador local
upbox.admin-inicial.usuario=administrador
upbox.admin-inicial.email=admin@example.com
# upbox.admin-inicial.senha=DEFINA_APENAS_NO_ARQUIVO_LOCAL
