# Opcional: copie para application-local.properties na raiz do projeto.
# A configuracao padrao da escola JA esta em src/main/resources/application.properties.
# Portanto, para o PostgreSQL escolar (localhost:5432/upbox, usuario postgres),
# nao e necessario repetir usuario ou senha aqui.
# Se o servidor ou a senha forem diferentes, remova o # e substitua:
# spring.datasource.url=jdbc:postgresql://localhost:5432/upbox
# spring.datasource.username=postgres
# spring.datasource.password=OUTRA_SENHA_LOCAL

# Primeiro administrador do UpBox (DIFERENTE do usuario postgres do banco).
# Configure uma senha propria de login apenas neste arquivo local e habilite a criacao.
upbox.admin-inicial.habilitado=false
upbox.admin-inicial.nome=Administrador da equipe
upbox.admin-inicial.usuario=administrador
upbox.admin-inicial.email=admin@example.com
# upbox.admin-inicial.senha=DEFINA_UMA_SENHA_FORTE_SOMENTE_AQUI
