name: Testes do UpBox

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Java 17 e Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Executar testes
        run: mvn -B clean test

  postgres:
    strategy:
      matrix:
        postgres: ["9.6.24", "16.4"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: upbox_test
          POSTGRES_USER: upbox_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U upbox_test -d upbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UPBOX_TEST_DB_URL: jdbc:postgresql://localhost:5432/upbox_test
      UPBOX_TEST_DB_USER: upbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verificar integração real e concorrência
        run: mvn -B -Ppostgres-it verify

  distribuicao-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testar e empacotar
        run: mvn -B clean package
      - name: Executar ZIP e script no Windows com PostgreSQL descartável
        shell: pwsh
        run: ./scripts/testar-pacote-windows.ps1 -Pacote target/upbox-sistema-1.0.0-escola.zip
      - name: Publicar pacote homologado
        uses: actions/upload-artifact@v4
        with:
          name: UpBox-escola
          path: target/upbox-sistema-1.0.0-escola.zip
      - name: Guardar evidências Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-windows
          path: |
            target/homologacao-windows.json
            target/windows-upbox.log
