name: Testes do UpBox

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Java 17 e Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Executar testes
        run: mvn -B clean test

  mysql:
    strategy:
      matrix:
        versao: ["5.7.44", "8.0.44"]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:${{ matrix.versao }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: upbox_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      UPBOX_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/upbox_test
      UPBOX_TEST_DB_USER: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Preparar charset do banco descartável
        run: docker exec ${{ job.services.mysql.id }} mysql -uroot -e "ALTER DATABASE upbox_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
      - run: mvn -B -Pmysql-it verify

  distribuicao-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testar e empacotar
        run: mvn -B clean package
      - name: Gerar ZIP simples
        shell: pwsh
        run: ./scripts/gerar-pacote.ps1
      - name: Executar ZIP e script no Windows com MySQL descartável
        shell: pwsh
        run: ./scripts/testar-pacote-windows.ps1 -Pacote target/UpBox-escola.zip
      - name: Publicar pacote homologado
        uses: actions/upload-artifact@v4
        with:
          name: UpBox-escola
          path: target/UpBox-escola.zip
      - name: Guardar evidências Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-windows
          path: |
            target/homologacao-windows.json
            target/windows-upbox.log
            target/windows-mysql.log
